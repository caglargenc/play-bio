name: Update inventory from Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  update-inventory:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download and convert inventory
        run: node scripts/update-inventory.mjs

      - name: Commit changes when needed
        run: |
          if git diff --quiet -- assets/js/inventory-data.js; then
            echo "Inventory is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/inventory-data.js
          git commit -m "Update inventory from Google Sheets"
          git push